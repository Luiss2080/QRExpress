<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de QR</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 20px; text-align: center; }
  input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  button { margin-top: 12px; padding: 10px 18px; background: #2c3e50; color: white; border: none; border-radius: 6px; cursor: pointer; }
  img { margin-top: 20px; border: 1px solid #eee; border-radius: 8px; }
</style>
</head>
<body>
  <h1>📱 Generador de QR</h1>
  <input type="text" id="texto" placeholder="Escribí una URL o texto...">
  <button id="btn-generar">Generar QR</button>
  <div id="resultado"></div>
  <script src="script.js"></script>
</body>
</html>
