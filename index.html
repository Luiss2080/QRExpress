<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Pro - Generador Comercial Interactivo</title>
  <meta name="description" content="Genera códigos QR personalizados de alta calidad. Soporte para URL, Texto, WiFi, vCard y WhatsApp. Interfaz premium y modular.">
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Librería qr-code-styling para soportar logos, SVG y estilos avanzados -->
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
</head>
<body>
  <header>
    <h1>QR Pro</h1>
    <p>Crea, personaliza y comparte tus QRs en segundos</p>
  </header>

  <div class="container">
    <!-- Panel Izquierdo: Controles -->
    <main class="glass-panel">
      <!-- Scrollable Tabs para móviles -->
      <div style="overflow-x: auto; margin-bottom: 2rem; padding-bottom: 5px;">
        <div class="tabs" id="type-tabs" style="min-width: 400px; margin-bottom: 0;">
          <button class="tab-btn active" data-type="url">URL</button>
          <button class="tab-btn" data-type="text">Texto</button>
          <button class="tab-btn" data-type="wifi">WiFi</button>
          <button class="tab-btn" data-type="vcard">Contacto</button>
          <button class="tab-btn" data-type="whatsapp">WhatsApp</button>
        </div>
      </div>

      <div id="error-msg" class="error-message"></div>

      <!-- Formularios Dinámicos -->
      <div id="form-url" class="type-form">
        <div class="form-group">
          <label for="url-input">Enlace (URL)</label>
          <input type="url" id="url-input" placeholder="https://ejemplo.com">
        </div>
      </div>

      <div id="form-text" class="type-form hidden">
        <div class="form-group">
          <label for="text-input">Texto Libre</label>
          <textarea id="text-input" rows="3" placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>
      </div>

      <div id="form-wifi" class="type-form hidden">
        <div class="form-group">
          <label for="wifi-ssid">Nombre de la Red (SSID)</label>
          <input type="text" id="wifi-ssid" placeholder="Mi_Red_WiFi">
        </div>
        <div class="form-group">
          <label for="wifi-password">Contraseña</label>
          <input type="password" id="wifi-password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="wifi-type">Tipo de Seguridad</label>
          <select id="wifi-type">
            <option value="WPA">WPA/WPA2</option>
            <option value="WEP">WEP</option>
            <option value="nopass">Ninguna</option>
          </select>
        </div>
      </div>

      <div id="form-vcard" class="type-form hidden">
        <div class="form-group">
          <label for="vc-name">Nombre Completo</label>
          <input type="text" id="vc-name" placeholder="Juan Pérez">
        </div>
        <div class="form-group">
          <label for="vc-phone">Número de Teléfono</label>
          <input type="tel" id="vc-phone" placeholder="+123456789">
        </div>
        <div class="form-group">
          <label for="vc-email">Correo Electrónico</label>
          <input type="email" id="vc-email" placeholder="juan@ejemplo.com">
        </div>
      </div>
      
      <div id="form-whatsapp" class="type-form hidden">
        <div class="form-group">
          <label for="wa-phone">Número (con código de país)</label>
          <input type="tel" id="wa-phone" placeholder="34600000000">
        </div>
        <div class="form-group">
          <label for="wa-msg">Mensaje (opcional)</label>
          <input type="text" id="wa-msg" placeholder="Hola, me gustaría más información">
        </div>
      </div>

      <!-- Sección de Personalización Avanzada -->
      <h3 style="margin-top: 1.5rem; color: var(--primary); font-size: 1.1rem;">Personalización Avanzada</h3>
      
      <div class="form-group" style="margin-top: 1rem;">
          <label for="dot-style">Estilo de los Puntos</label>
          <select id="dot-style">
            <option value="square">Cuadrados Clásicos</option>
            <option value="dots">Puntos Redondos</option>
            <option value="rounded">Suavizados</option>
            <option value="classy">Elegante</option>
          </select>
      </div>

      <div class="form-group">
          <label for="logo-upload">Logo central (opcional)</label>
          <input type="file" id="logo-upload" accept="image/png, image/jpeg, image/svg+xml" style="padding: 0.5rem; background: rgba(0,0,0,0.1);">
      </div>

      <div class="color-pickers">
        <div class="color-picker">
          <label for="color-dark">Color Frontal</label>
          <input type="color" id="color-dark" value="#000000">
        </div>
        <div class="color-picker">
          <label for="color-light">Color de Fondo</label>
          <input type="color" id="color-light" value="#ffffff">
        </div>
      </div>

      <button id="btn-generar" class="btn">
        Generar QR Mágico
      </button>
    </main>

    <!-- Panel Derecho: Resultado -->
    <aside class="glass-panel result-panel">
      <div id="qrcode-wrapper">
        <div id="qrcode">
          <span id="qrcode-placeholder">
            Tu QR aparecerá aquí
          </span>
        </div>
      </div>
      
      <div style="display: flex; gap: 10px; width: 100%;">
          <button id="btn-descargar-png" class="btn btn-success hidden" style="flex: 1; font-size: 0.95rem;">
            Descargar PNG
          </button>
          <button id="btn-descargar-svg" class="btn hidden" style="flex: 1; font-size: 0.95rem; background: linear-gradient(135deg, #3b82f6, #2563eb);">
            Descargar SVG
          </button>
      </div>
    </aside>
  </div>

  <!-- Historial -->
  <section class="history-section">
    <h2>Tus Generaciones Recientes</h2>
    <div id="history-container" class="history-grid">
      <!-- Elementos inyectados por JS -->
    </div>
  </section>

  <!-- Módulo principal de la aplicación -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
