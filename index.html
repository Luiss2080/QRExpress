<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Pro - Generador Comercial</title>
  <meta name="description" content="Genera códigos QR personalizados de alta calidad. Soporte para URL, Texto, WiFi y vCard.">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header>
    <h1>QR Pro</h1>
    <p>Genera, personaliza y descarga códigos QR profesionales</p>
  </header>

  <div class="container">
    <!-- Panel Izquierdo: Controles -->
    <main class="glass-panel">
      <div class="tabs" id="type-tabs">
        <button class="tab-btn active" data-type="url">URL</button>
        <button class="tab-btn" data-type="text">Texto</button>
        <button class="tab-btn" data-type="wifi">WiFi</button>
        <button class="tab-btn" data-type="vcard">Contacto</button>
      </div>

      <div id="error-msg" class="error-message"></div>

      <!-- Formularios Dinámicos -->
      <div id="form-url" class="type-form">
        <div class="form-group">
          <label for="url-input">Enlace (URL)</label>
          <input type="url" id="url-input" placeholder="https://ejemplo.com">
        </div>
      </div>

      <div id="form-text" class="type-form hidden">
        <div class="form-group">
          <label for="text-input">Texto</label>
          <textarea id="text-input" rows="3" placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>
      </div>

      <div id="form-wifi" class="type-form hidden">
        <div class="form-group">
          <label for="wifi-ssid">Nombre de la Red (SSID)</label>
          <input type="text" id="wifi-ssid" placeholder="Mi_Red_WiFi">
        </div>
        <div class="form-group">
          <label for="wifi-password">Contraseña</label>
          <input type="password" id="wifi-password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="wifi-type">Seguridad</label>
          <select id="wifi-type">
            <option value="WPA">WPA/WPA2</option>
            <option value="WEP">WEP</option>
            <option value="nopass">Ninguna</option>
          </select>
        </div>
      </div>

      <div id="form-vcard" class="type-form hidden">
        <div class="form-group">
          <label for="vc-name">Nombre Completo</label>
          <input type="text" id="vc-name" placeholder="Juan Pérez">
        </div>
        <div class="form-group">
          <label for="vc-phone">Teléfono</label>
          <input type="tel" id="vc-phone" placeholder="+123456789">
        </div>
        <div class="form-group">
          <label for="vc-email">Email</label>
          <input type="email" id="vc-email" placeholder="juan@ejemplo.com">
        </div>
      </div>

      <!-- Personalización -->
      <div class="color-pickers">
        <div class="color-picker">
          <label for="color-dark">Color Frontal</label>
          <input type="color" id="color-dark" value="#000000">
        </div>
        <div class="color-picker">
          <label for="color-light">Color Fondo</label>
          <input type="color" id="color-light" value="#ffffff">
        </div>
      </div>

      <button id="btn-generar" class="btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><rect x="7" y="7" width="3" height="3"></rect><rect x="14" y="7" width="3" height="3"></rect><rect x="7" y="14" width="3" height="3"></rect><rect x="14" y="14" width="3" height="3"></rect></svg>
        Generar QR
      </button>
    </main>

    <!-- Panel Derecho: Resultado -->
    <aside class="glass-panel result-panel">
      <div id="qrcode">
        <span id="qrcode-placeholder">Tu código QR aparecerá aquí</span>
      </div>
      
      <button id="btn-descargar" class="btn hidden" style="background: #10b981;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Descargar PNG
      </button>
    </aside>
  </div>

  <!-- Historial -->
  <section class="history-section">
    <h2>Historial Reciente</h2>
    <div id="history-container" class="history-grid">
      <!-- Elementos inyectados por JS -->
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
