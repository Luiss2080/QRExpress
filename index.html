<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Pro - Generador Comercial Interactivo</title>
  <meta name="description" content="Genera códigos QR personalizados de alta calidad. Soporte para URL, Texto, WiFi y vCard. Interfaz premium y moderna.">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header>
    <h1>QR Pro</h1>
    <p>Crea, personaliza y comparte tus QRs en segundos</p>
  </header>

  <div class="container">
    <!-- Panel Izquierdo: Controles -->
    <main class="glass-panel">
      <div class="tabs" id="type-tabs">
        <button class="tab-btn active" data-type="url">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          URL
        </button>
        <button class="tab-btn" data-type="text">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg>
          Texto
        </button>
        <button class="tab-btn" data-type="wifi">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
          WiFi
        </button>
        <button class="tab-btn" data-type="vcard">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Contacto
        </button>
      </div>

      <div id="error-msg" class="error-message"></div>

      <!-- Formularios Dinámicos -->
      <div id="form-url" class="type-form">
        <div class="form-group">
          <label for="url-input">Enlace (URL)</label>
          <input type="url" id="url-input" placeholder="https://ejemplo.com">
        </div>
      </div>

      <div id="form-text" class="type-form hidden">
        <div class="form-group">
          <label for="text-input">Texto</label>
          <textarea id="text-input" rows="3" placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>
      </div>

      <div id="form-wifi" class="type-form hidden">
        <div class="form-group">
          <label for="wifi-ssid">Nombre de la Red (SSID)</label>
          <input type="text" id="wifi-ssid" placeholder="Mi_Red_WiFi">
        </div>
        <div class="form-group">
          <label for="wifi-password">Contraseña</label>
          <input type="password" id="wifi-password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="wifi-type">Tipo de Seguridad</label>
          <select id="wifi-type">
            <option value="WPA">WPA/WPA2</option>
            <option value="WEP">WEP</option>
            <option value="nopass">Ninguna</option>
          </select>
        </div>
      </div>

      <div id="form-vcard" class="type-form hidden">
        <div class="form-group">
          <label for="vc-name">Nombre Completo</label>
          <input type="text" id="vc-name" placeholder="Juan Pérez">
        </div>
        <div class="form-group">
          <label for="vc-phone">Número de Teléfono</label>
          <input type="tel" id="vc-phone" placeholder="+123456789">
        </div>
        <div class="form-group">
          <label for="vc-email">Correo Electrónico</label>
          <input type="email" id="vc-email" placeholder="juan@ejemplo.com">
        </div>
      </div>

      <!-- Personalización -->
      <div class="color-pickers">
        <div class="color-picker">
          <label for="color-dark">Frontal</label>
          <input type="color" id="color-dark" value="#000000">
        </div>
        <div class="color-picker">
          <label for="color-light">Fondo</label>
          <input type="color" id="color-light" value="#ffffff">
        </div>
      </div>

      <button id="btn-generar" class="btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        Generar QR Mágico
      </button>
    </main>

    <!-- Panel Derecho: Resultado -->
    <aside class="glass-panel result-panel">
      <div id="qrcode-wrapper">
        <div id="qrcode">
          <span id="qrcode-placeholder">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            Tu QR aparecerá aquí
          </span>
        </div>
      </div>
      
      <button id="btn-descargar" class="btn btn-success hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Descargar Alta Calidad
      </button>
    </aside>
  </div>

  <!-- Historial -->
  <section class="history-section">
    <h2>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      Tus Generaciones Recientes
    </h2>
    <div id="history-container" class="history-grid">
      <!-- Elementos inyectados por JS -->
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
